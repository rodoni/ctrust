version: 1
status: draft
organization:
  schema: 1
  naming_rule: semantic-v1
  slice: SLICE_ID
  implementation_file: "src/<slice-name>.rs"
  unit_test_file: "src/<slice-name>.rs"
  integration_test_file: "tests/<slice-name>_integration.rs"
  module_path: "crate::<slice-name>"
  shared_type_references: []
  public_reexports: []

source:
  project_root: ""
  component: ""
  files: []
  data_structures: inventory/slices/UNIT_NAME/data-structures.yaml

target:
  workspace_root: ""
  project_root: ""
  path: ""
  crate_name: ""
  workspace_member: true

output:
  kind: library
  library_kind: rlib
  binary_name: ""

contract: contracts/units/UNIT_NAME.yaml

rust_types:
  - c_symbol: TYPE_OR_FUNCTION
    rust_type: ""
    visibility: private
    rationale: ""
    invariants: []

api:
  functions:
    - name: FUNCTION_NAME
      rust_signature: ""
      source:
        file: "src/file.c"
        line: 1
        symbol: FUNCTION_NAME
        slice: "SLICE_ID"
        contract: "C-CONTRACT-001"
      rust_file: "crates/domain/src/parser.rs"
      module_path: "crate::parser::parse_token"
      origin_comment_required: true
      ownership: ""
      errors: []
      unsafe: false
      ffi_required: false

mapping_decisions:
  pointers: []
  strings: []
  errors: []
  callbacks: []
  macros: []
  globals: []

intentional_differences: []
open_questions: []
validation:
  characterization_tests: []
  rust_tests: []
  equivalence_checks: []
  completion_criteria: []
