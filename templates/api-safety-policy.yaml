version: 1
kind: domain-api-safety-policy
scope_globs:
  - "**/domain/**/*.rs"
  - "**/src/domain/**/*.rs"
forbidden_public_patterns:
  - raw_c_pointer
  - shared_memory_offset
  - process_specific_address
  - transport_dto
required_representations:
  - owned_value
  - immutable_snapshot
  - stable_id
  - typed_handle
unsafe:
  allowed_only_in: [transport_adapter, ffi_boundary]
  requires_source_and_invariant: true
