version: 1
kind: architecture-dependency-policy
scope:
  domain_crates: []
  transport_crates: []
  application_crates: []
forbidden_in_domain:
  - zenoh
  - zenoh-ext
  - serde_json
conditional_in_domain:
  - serde
allowed_direction:
  - application -> transport
  - application -> domain
  - transport -> domain
forbidden_direction:
  - domain -> transport
  - domain -> application
checks:
  default_features: required
  no_all_features_substitute: true
  report_dependency_path: true
